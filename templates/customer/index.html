<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leather Goods Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Luxury Leather Assistant</h2>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Chat messages will appear here -->
            <div class="message assistant">Hello! How can I help you find the perfect leather piece today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
        <div class="product-recommendations" id="product-recommendations">
            <!-- Product recommendations will appear here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
